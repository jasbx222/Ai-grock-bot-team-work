<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1c14" />
  <link rel="icon" href="data:," />
  <title>مكتبنا الدافئ</title>
</head>
<body>
  <main id="stage"><canvas id="scene"></canvas><div id="labels"></div></main>

  <header id="topbar">
    <div class="card brand">
      <div class="logo">🏡</div>
      <div><h1>مكتبنا الدافئ</h1><p>مساحة عمل، عائلة، وإنجاز</p></div>
      <div class="hello"><b id="greet">مساء الخير</b><span id="clock"></span></div>
    </div>
    <div class="chips"><span id="feedDot" class="dot"></span><span id="feedText">جاري التحميل…</span>
      <span id="sampleBadge" class="sample" hidden>SAMPLE · بيانات تجريبية</span><span id="fps" class="fps"></span></div>
  </header>

  <section id="team" aria-label="فريق اليوم">
    <div class="grab"></div>
    <div class="team-head"><h2>فريق اليوم</h2><span id="teamCount"></span></div>
    <ul id="people"></ul>
  </section>

  <div id="controls">
    <button id="modeBtn" class="btn teal">🚶 وضع المشي</button>
    <button id="gatherBtn" class="btn amber">☕ اجتمعوا</button>
    <button id="resetBtn" class="btn">⌂ نظرة عامة</button>
  </div>
  <div id="joystick" hidden><div class="knob"></div></div>
  <div id="walkHelp" hidden>W A S D أو الجويستيك للمشي · اضغط على أي واحد بالقائمة حتى تروح يمّه</div>
  <button id="talkPrompt" hidden></button>

  <aside id="chat" aria-label="المحادثة">
    <div class="head">
      <div class="avatar"></div>
      <div class="info"><div class="who"></div><div class="role"></div></div>
      <button class="clear" title="مسح المحادثة">🗑</button>
      <button class="close" title="إغلاق">✕</button>
    </div>
    <div class="statusline"><span class="st pill"></span><span class="task"></span></div>
    <div class="demo-banner">وضع تجريبي: الردود تتولّد محلياً ومعلّمة «ردّ تجريبي» — مو من الوكيل الحقيقي.</div>
    <div class="messages"></div>
    <div class="typing" hidden><span></span><span></span><span></span></div>
    <form><textarea rows="1" placeholder="اكتب رسالة…"></textarea><button type="submit" class="send">إرسال</button></form>
  </aside>

  <div id="loading">☕ جاري تجهيز المكتب الدافئ…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
