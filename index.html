<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>مكتب الوكلاء 3D</title>
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>

  <header id="topbar">
    <div class="brand"><span class="logo">◆</span> مكتب الوكلاء <small>نسخة تجريبية</small></div>
    <div class="legend">
      <span class="pill working">يشتغل</span><span class="pill waiting">ينتظر</span>
      <span class="pill problem">عنده مشكلة</span><span class="pill done">خلّص</span>
    </div>
    <div class="feed"><span id="feedDot" class="dot"></span><span id="feedText">جاري التحميل…</span>
      <span id="sampleBadge" class="sample" hidden>بيانات تجريبية</span><span id="fps" class="fps"></span></div>
  </header>

  <nav id="people"></nav>

  <div id="modebar">
    <button id="modeBtn" class="btn primary">🚶 تمشّى بالمكتب</button>
    <button id="resetBtn" class="btn">⌂ نظرة عامة</button>
  </div>

  <div id="walkHelp" hidden>
    <span class="desk">W A S D للمشي · اسحب بالماوس للتلفّت · Shift للركض</span>
    <span class="touch">الجويستيك للمشي · اسحب بالشاشة للتلفّت</span>
  </div>
  <div id="joystick" hidden><div class="knob"></div></div>
  <div id="crosshair" hidden></div>

  <aside id="chat" aria-label="المحادثة">
    <div class="head">
      <div class="avatar"></div>
      <div class="info"><div class="who"></div><div class="role"></div></div>
      <button class="clear" title="مسح المحادثة">🗑</button>
      <button class="close" title="إغلاق">✕</button>
    </div>
    <div class="statusline"><span class="st pill"></span><span class="task"></span></div>
    <div class="demo-banner">وضع تجريبي: الردود تتولّد محلياً ومعلّمة «ردّ تجريبي» — مو من الوكيل الحقيقي.</div>
    <div class="messages"></div>
    <div class="typing" hidden><span></span><span></span><span></span></div>
    <form><textarea rows="1" placeholder="اكتب رسالة…"></textarea><button type="submit" class="send">إرسال</button></form>
  </aside>

  <div id="loading">☕ جاري تجهيز المكتب الدافئ…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
